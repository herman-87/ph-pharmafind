openapi: 3.0.3
info:
  title: Pharmafind API — Pharmacy Service
  version: 1.0.0
servers:
  - url: http://localhost:9000

tags:
  - name: Pharmacy
    description: Pharmacy management
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiErrorResponseDTO:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        violations:
          type: object
          additionalProperties:
            type: string
    PharmacyIdResponseDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    OpeningHourDTO:
      type: object
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY]
        openTime:
          type: string
          example: "08:00"
        closeTime:
          type: string
          example: "20:00"
        isClosed:
          type: boolean
    DutyScheduleDTO:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        startTime:
          type: string
          example: "20:00"
        endTime:
          type: string
          example: "08:00"
    PaymentMethodDTO:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [CASH, MTN_MOMO, ORANGE_MONEY, VISA, MASTERCARD]
        accountNumber:
          type: string
          example: "+237677000000"
    SocialLinkDTO:
      type: object
      properties:
        type:
          type: string
          enum: [FACEBOOK, INSTAGRAM, WHATSAPP, WEBSITE]
        value:
          type: string
    CreatePharmacyRequestDTO:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - password
        - confirmPassword
        - name
        - city
        - district
        - fullAddress
        - latitude
        - longitude
        - openingHours
        - paymentMethods
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 60
        lastName:
          type: string
          minLength: 2
          maxLength: 60
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+237677000000"
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password
        name:
          type: string
          minLength: 2
          maxLength: 120
        registrationNumber:
          type: string
        taxId:
          type: string
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        is24h:
          type: boolean
          default: false
        deliveryAvailable:
          type: boolean
          default: false
        deliveryRadiusKm:
          type: integer
          minimum: 1
        openingHours:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialLinkDTO'
    UpdatePharmacyRequestDTO:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is24h:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: integer
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialLinkDTO'
    PharmacyResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, REJECTED]
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is24h:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: integer
        logoUrl:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialLinkDTO'
        createdAt:
          type: string
          format: date-time
    PharmacyPageResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PharmacyResponseDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

paths:

  /api/pharmacies:
    post:
      tags: [Pharmacy]
      operationId: createPharmacy
      summary: Créer une pharmacie et son compte propriétaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePharmacyRequestDTO'
      responses:
        '201':
          description: Pharmacie créée — retourne uniquement l'id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyIdResponseDTO'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '409':
          description: Email, téléphone ou nom de pharmacie déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

    get:
      tags: [Pharmacy]
      operationId: listPharmacies
      summary: Lister les pharmacies actives
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: city
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyPageResponseDTO'

  /api/pharmacies/{id}:
    get:
      tags: [Pharmacy]
      operationId: getPharmacy
      summary: Détails d'une pharmacie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails de la pharmacie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyResponseDTO'
        '404':
          description: Pharmacie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

    put:
      tags: [Pharmacy]
      operationId: updatePharmacy
      summary: Modifier une pharmacie
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePharmacyRequestDTO'
      responses:
        '204':
          description: Mise à jour effectuée — aucun contenu retourné
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: Accès refusé — pas propriétaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: Pharmacie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

    delete:
      tags: [Pharmacy]
      operationId: deletePharmacy
      summary: Supprimer une pharmacie
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Suppression effectuée — aucun contenu retourné
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: Pharmacie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /api/pharmacies/{id}/verify:
    post:
      tags: [Pharmacy]
      operationId: verifyPharmacy
      summary: Vérifier le compte pharmacie via token email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Compte vérifié avec succès
        '400':
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: Pharmacie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'