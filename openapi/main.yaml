openapi: 3.0.3
info:
  title: Pharmafind API — Pharmacy Service
  version: 1.0.0
servers:
  - url: http://localhost:9000

tags:
  - name: Pharmacy
    description: Pharmacy management
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiErrorResponseDTO:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        errorCode:
          type: string
        violations:
          type: object
          additionalProperties:
            type: string
    PharmacyIdResponseDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    OpeningHourDTO:
      type: object
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY]
        openTime:
          type: string
          example: "08:00"
        closeTime:
          type: string
          example: "20:00"
        isClosed:
          type: boolean
    DutyScheduleDTO:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        startTime:
          type: string
          example: "20:00"
        endTime:
          type: string
          example: "08:00"
    PaymentMethodDTO:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [CASH, MTN_MOMO, ORANGE_MONEY, VISA, MASTERCARD]
        accountNumber:
          type: string
          example: "+237677000000"
    SocialMediaTypeEnum:
        type: string
        enum: [FACEBOOK, INSTAGRAM, TIKTOK, WHATSAPP, WEBSITE, TWITTER, LINKEDIN, YOUTUBE, TELEGRAM, VIBER]
    CreatePharmacyRequestDTO:
      type: object
      required:
        - name
        - email
        - phone
        - city
        - district
        - fullAddress
        - latitude
        - longitude
        - openingHours
        - paymentMethods
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+237677000000"
        registrationNumber:
          type: string
        taxId:
          type: string
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        is24h:
          type: boolean
          default: false
        deliveryAvailable:
          type: boolean
          default: false
        deliveryRadiusKm:
          type: integer
          minimum: 1
        openingHours:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: object
          additionalProperties:
            type: string
          example:
            WEBSITE: "https://mapharmacie.bf"
            FACEBOOK: "https://facebook.com/mapharmacie"
            INSTAGRAM: "https://instagram.com/mapharmacie"
            WHATSAPP: "+226 70 00 00 00"
    UpdatePharmacyRequestDTO:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is24h:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: integer
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: object
          additionalProperties:
            type: string
    PharmacyResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        registrationNumber:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, REJECTED]
        isCertified:
          type: boolean
          default: false
        city:
          type: string
        district:
          type: string
        locality:
          type: string
        fullAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is24h:
          type: boolean
        deliveryAvailable:
          type: boolean
        deliveryRadiusKm:
          type: integer
        logoUrl:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHourDTO'
        dutySchedules:
          type: array
          items:
            $ref: '#/components/schemas/DutyScheduleDTO'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodDTO'
        socialLinks:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PharmacyPageResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PharmacyResponseDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CreateCertificationRequestDTO:
      type: object
      required: [authorizationNumber, taxId, legalRepresentative, creationDate]
      properties:
        authorizationNumber:
          type: string
          example: "AUT-2026-000123"
        taxId:
          type: string
          example: "IFU-00000000"
        legalRepresentative:
          type: string
          example: "Dr. Aïcha OUEDRAOGO"
        creationDate:
          type: string
          format: date
        authorizationDocument:
          type: string
        businessRegistryDocument:
          type: string
        ownerIdRectoDocument:
          type: string
        ownerIdVersoDocument:
          type: string
        pharmacyLicenseDocument:
          type: string
        notes:
          type: string
    CertificationRequestIdResponseDTO:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    CertificationRequestResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pharmacyId:
          type: string
          format: uuid
        authorizationNumber:
          type: string
        taxId:
          type: string
        legalRepresentative:
          type: string
        creationDate:
          type: string
          format: date
        authorizationDocument:
          type: string
        businessRegistryDocument:
          type: string
        ownerIdRectoDocument:
          type: string
        ownerIdVersoDocument:
          type: string
        pharmacyLicenseDocument:
          type: string
        notes:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
paths:
  /me/pharmacies:
    get:
      tags: [Pharmacy]
      operationId: getMyPharmacies
      summary: List pharmacies owned by the current authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of owned pharmacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyPageResponseDTO'
        '401':
          description: "40101 — Not authenticated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
    post:
      tags: [Pharmacy]
      operationId: createPharmacy
      summary: Create a pharmacy (owner)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePharmacyRequestDTO'
      responses:
        '201':
          description: Pharmacy created — returns only the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyIdResponseDTO'
        '400':
          description: "40001 — Validation error, 40002 — Invalid email format, 40003 — Invalid phone format"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '401':
          description: "40101 — Not authenticated, 40102 — Token expired, 40103 — Token invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '409':
          description: "40901 — Email already exists, 40902 — Phone already exists"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /me/pharmacies/{id}:
    put:
      tags: [Pharmacy]
      operationId: updatePharmacy
      summary: Update a pharmacy (owner)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePharmacyRequestDTO'
      responses:
        '204':
          description: Update completed — no content returned
        '401':
          description: "40101 — Not authenticated, 40102 — Token expired, 40103 — Token invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: "40301 — Access denied"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: "40401 — Pharmacy not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
    delete:
      tags: [Pharmacy]
      operationId: deletePharmacy
      summary: Delete a pharmacy (owner)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deletion completed — no content returned
        '401':
          description: "40101 — Not authenticated, 40102 — Token expired, 40103 — Token invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: "40301 — Access denied"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: "40401 — Pharmacy not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /me/pharmacies/{id}/certification-requests:
    post:
      tags: [Pharmacy]
      operationId: createCertificationRequest
      summary: Create a certification request for a pharmacy (owner)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificationRequestDTO'
      responses:
        '201':
          description: Certification request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationRequestIdResponseDTO'
        '401':
          description: "40101 — Not authenticated, 40102 — Token expired, 40103 — Token invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: "40301 — Access denied"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: "40401 — Pharmacy not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /me/pharmacies/{pharmacyId}/certification-requests/{requestId}:
    get:
      tags: [Pharmacy]
      operationId: getCertificationRequest
      summary: Get certification request details (owner)
      security:
        - BearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Pharmacy ID
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Certification request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationRequestResponseDTO'
        '401':
          description: "40101 — Not authenticated, 40102 — Token expired, 40103 — Token invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '403':
          description: "40301 — Access denied"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: "40401 — Pharmacy not found, 40402 — Certification request not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /public/pharmacies:
    get:
      tags: [Pharmacy]
      operationId: listPharmacies
      summary: List active pharmacies
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: city
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyPageResponseDTO'

  /public/pharmacies/{id}:
    get:
      tags: [Pharmacy]
      operationId: getPharmacy
      summary: Pharmacy details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pharmacy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyResponseDTO'
        '404':
          description: "40401 — Pharmacy not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'

  /public/pharmacies/{id}/verify:
    post:
      tags: [Pharmacy]
      operationId: verifyPharmacy
      summary: Verify pharmacy account via email token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Account verified successfully
        '400':
          description: "40006 — Invalid token, 40007 — Token expired"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '404':
          description: "40401 — Pharmacy not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'