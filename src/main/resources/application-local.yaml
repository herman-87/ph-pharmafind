spring:
  application:
    name: "user"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ""
            client-secret: ""
            scope:
              - openid
              - profile
              - email
            redirect-uri: "http://localhost:9000/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: "https://accounts.google.com"
  datasource:
    url: ${LOCAL_DATABASE_URL:jdbc:h2:mem:ph_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${LOCAL_DATABASE_USERNAME:sa}
    password: ${LOCAL_DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/master.xml"
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:9000}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    liquibase: DEBUG
    org.springframework.security: DEBUG
    com.ph.user: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  security:
    issuer: "${APP_SECURITY_ISSUER:http://localhost:9000}"
    frontend-login-url: "${APP_FRONTEND_LOGIN_URL:http://localhost:9000/hello}"
    allowed-origins:
      - ${APP_CORS_ORIGIN:http://localhost:3000}
  jwt:
    issuer: ${APP_SECURITY_ISSUER:http://localhost:9000}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
    rsa:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:src/main/resources/certs/private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:src/main/resources/certs/public.pem}

eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

